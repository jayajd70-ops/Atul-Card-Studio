<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ny_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <radialGradient id="ny_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#facc15" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ny_sky)"/>
  <circle cx="400" cy="220" r="280" fill="url(#ny_glow)"/>

  <!-- Exploding Fireworks -->
  <g stroke="#facc15" stroke-width="3" stroke-linecap="round">
    <!-- Left Firework -->
    <g transform="translate(180, 140)">
      <line x1="0" y1="0" x2="0" y2="-60"/>
      <line x1="0" y1="0" x2="42" y2="-42"/>
      <line x1="0" y1="0" x2="60" y2="0"/>
      <line x1="0" y1="0" x2="42" y2="42"/>
      <line x1="0" y1="0" x2="0" y2="60"/>
      <line x1="0" y1="0" x2="-42" y2="42"/>
      <line x1="0" y1="0" x2="-60" y2="0"/>
      <line x1="0" y1="0" x2="-42" y2="-42"/>
      <circle cx="0" cy="0" r="8" fill="#fff"/>
    </g>
    <!-- Right Firework (Magenta/Gold) -->
    <g transform="translate(620, 160)" stroke="#ec4899">
      <line x1="0" y1="0" x2="0" y2="-55"/>
      <line x1="0" y1="0" x2="38" y2="-38"/>
      <line x1="0" y1="0" x2="55" y2="0"/>
      <line x1="0" y1="0" x2="38" y2="38"/>
      <line x1="0" y1="0" x2="0" y2="55"/>
      <line x1="0" y1="0" x2="-38" y2="38"/>
      <line x1="0" y1="0" x2="-55" y2="0"/>
      <line x1="0" y1="0" x2="-38" y2="-38"/>
      <circle cx="0" cy="0" r="7" fill="#facc15"/>
    </g>
  </g>

  <!-- Central Firework Burst & Confetti -->
  <g transform="translate(400, 300)">
    <g stroke="#fef08a" stroke-width="3.5" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-75"/>
      <line x1="0" y1="0" x2="53" y2="-53"/>
      <line x1="0" y1="0" x2="75" y2="0"/>
      <line x1="0" y1="0" x2="53" y2="53"/>
      <line x1="0" y1="0" x2="0" y2="75"/>
      <line x1="0" y1="0" x2="-53" y2="53"/>
      <line x1="0" y1="0" x2="-75" y2="0"/>
      <line x1="0" y1="0" x2="-53" y2="-53"/>
    </g>
    <g stroke="#ec4899" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="0" x2="27" y2="-72"/>
      <line x1="0" y1="0" x2="72" y2="-27"/>
      <line x1="0" y1="0" x2="72" y2="27"/>
      <line x1="0" y1="0" x2="27" y2="72"/>
      <line x1="0" y1="0" x2="-27" y2="72"/>
      <line x1="0" y1="0" x2="-72" y2="27"/>
      <line x1="0" y1="0" x2="-72" y2="-27"/>
      <line x1="0" y1="0" x2="-27" y2="-72"/>
    </g>
    <circle cx="0" cy="0" r="11" fill="#ffffff" filter="drop-shadow(0 0 10px #facc15)"/>
    <!-- Confetti scatter -->
    <circle cx="-95" cy="-40" r="4" fill="#facc15"/>
    <circle cx="100" cy="-55" r="3.5" fill="#ec4899"/>
    <circle cx="-70" cy="60" r="3" fill="#ffffff"/>
    <circle cx="85" cy="55" r="4" fill="#fef08a"/>
    <rect x="-115" y="10" width="7" height="7" fill="#ec4899" transform="rotate(25 -115 10)"/>
    <rect x="110" y="5" width="7" height="7" fill="#facc15" transform="rotate(-20 110 5)"/>
  </g>
</svg>
